<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sem conexão — Arranchamento</title>
	<style>
		body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; color: #333; }
		.caixa { text-align: center; padding: 24px; max-width: 360px; }
		img { width: 96px; height: auto; }
		h1 { font-size: 20px; margin: 16px 0 8px; }
		p { color: #666; line-height: 1.5; }
		button { margin-top: 12px; padding: 10px 20px; font-size: 16px; border: 0; border-radius: 6px; background: #337ab7; color: #fff; }
	</style>
</head>
<body>
	<div class="caixa">
		<img src="/assets/img/app-192.png" alt="">
		<h1>Sem conexão</h1>
		<p>O arranchamento precisa de internet para mostrar e salvar as refeições. Confira o sinal e tente de novo.</p>
		<button type="button" onclick="location.reload()">Tentar de novo</button>
	</div>
</body>
</html>
