# Bloqueia acesso via navegador a arquivos sensíveis: configuração, dumps e backups do banco
# (inclusive compactados), logs, scripts e o repositório .git.
<FilesMatch "\.(yml|yaml|sql|gz|zip|tar|tgz|log|sh|env|bak|backup|php_bkp)$">
    Require all denied
</FilesMatch>

<DirectoryMatch "/\.git">
    Require all denied
</DirectoryMatch>

# Pastas que nunca devem ser servidas: backup/ (backups antigos) e logs/ (log de erros do PHP).
<DirectoryMatch "^/var/www/html/(backup|logs)(/|$)">
    Require all denied
</DirectoryMatch>

# Sem listagem do conteúdo das pastas.
<Directory /var/www/html>
    Options -Indexes
</Directory>
