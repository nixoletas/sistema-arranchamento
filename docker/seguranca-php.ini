; Endurecimento do PHP (montado em /usr/local/etc/php/conf.d/zz-seguranca.ini pelo docker-compose.yml).
; Cookie de sessão inacessível por JavaScript e enviado só em navegação do próprio site.
session.cookie_httponly = 1
session.cookie_samesite = Lax
; Recusa identificadores de sessão que o servidor não criou (evita fixação de sessão).
session.use_strict_mode = 1
session.use_only_cookies = 1
; Não anuncia a versão do PHP no cabeçalho das respostas.
expose_php = Off
