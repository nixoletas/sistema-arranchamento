# Entrada do app (Tailscale Funnel -> http://sisrancho-php:8081, pela rede interna do Docker).
# Não é publicada para a rede da OM: só o container do Tailscale e o próprio servidor chegam nela.
# Tudo que entra por aqui é marcado como ACESSO_EXTERNO=1: o PHP exige a senha do app (acesso-app.php).
Listen 8081

<VirtualHost *:8081>
	DocumentRoot /var/www/html
	SetEnv ACESSO_EXTERNO 1

	# Sessão do app: cookie só por HTTPS (o Funnel é sempre HTTPS), sem acesso por JavaScript.
	php_flag  session.cookie_httponly on
	php_value session.cookie_samesite Lax
	php_flag  session.cookie_secure on

	# Pelo app só a parte do militar: o painel (rancho/), o Vale, os relatórios e o resto ficam só na rede da OM.
	<Location "/">
		# Só o próprio servidor e a rede interna do Docker (container do Tailscale). Qualquer outro IP: negado.
		Require ip 127.0.0.1 172.16.0.0/12
		<If "%{REQUEST_URI} !~ m#^/($|\.well-known/assetlinks\.json$|app/($|index\.html$|arranchamento-53bis\.apk$|qrcode\.png$)|index\.php$|logout\.php$|manifest\.webmanifest$|sw\.js$|offline\.html$|controllers/(autentica|consulta|registros|bloqueios|arranchar-semana|senha-app)\.php$|assets/.+\.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$)#">
			Require all denied
		</If>
	</Location>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
